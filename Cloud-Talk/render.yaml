services:
  - type: web
    name: cloudtalk-api
    env: node
    plan: free
    region: oregon
    rootDir: .
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter ./artifacts/api-server run build
    startCommand: pnpm --filter ./artifacts/api-server run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: FRONTEND_URL
        value: https://cloudtalk-web.onrender.com

  - type: web
    name: cloudtalk-web
    env: node
    plan: free
    region: oregon
    rootDir: .
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter ./artifacts/cloudtalk run build
    startCommand: pnpm --filter ./artifacts/cloudtalk run serve
    envVars:
      - key: PORT
        value: 10000
      - key: VITE_API_BASE_URL
        value: https://cloudtalk-api.onrender.com
