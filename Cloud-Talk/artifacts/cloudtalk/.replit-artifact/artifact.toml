kind = "web"
previewPath = "/"
title = "CloudTalk"
version = "1.0.0"
id = "artifacts/cloudtalk"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24226

[services.development]
run = "pnpm --filter @workspace/cloudtalk run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/cloudtalk", "run", "build" ]
publicDir = "artifacts/cloudtalk/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24226"
BASE_PATH = "/"
